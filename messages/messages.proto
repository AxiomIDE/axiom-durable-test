// This file defines the data contracts (messages) for your Axiom package.
// Every node's --input and --output refers to a message defined here.
//
// Run `axiom create message <Name>` to scaffold a new message below.
// Run `axiom generate` to compile these definitions into language bindings in gen/.
//
// DOCUMENTATION
//   Comments written directly above a message or field declaration are extracted
//   automatically at publish time and shown in the Axiom registry as documentation.
//   Write your descriptions there — no separate doc files needed.
//
//   Leading comment  (no blank line before the declaration) → registry description ✓
//   Detached comment (blank line before the declaration)    → ignored by registry  ✗
//
// This file is yours to edit. Axiom only appends new message blocks — it never
// overwrites or removes content you have written.

syntax = "proto3";

package axiom_official.axiom_durable_test;

option go_package = ".;gen";

message Message {
  string text = 1;
  int32 value = 2;
  string note = 3;
}

message SlowRequest {
  string text = 1;
  int32 sleep_ms = 2;
}

message CounterState {
  int32 step = 1;
  int32 total = 2;
  string last_text = 3;
}

message MaybeFailRequest {
  string text = 1;
  bool fail = 2;
  string error_message = 3;
}

message SplitRequest {
  string text = 1;
  repeated string items = 2;
}

message ItemBatch {
  string text = 1;
  repeated string items = 2;
}

message ApprovalDecision {
  bool approved = 1;
  string reviewer_note = 2;
}

message ReviewerEdit {
  string new_text = 1;
  int32 new_value = 2;
}

// ApprovalStatus is the enum used by ApprovalDecisionV2. Drives the
// hitl-gates/enum coverage variant — exercises ProtoForm.tsx's Radix
// Select rendering for enum fields (placeholder "Choose…", options
// labelled "<NAME> (<number>)"). Coverage FR-007.
enum ApprovalStatus {
  APPROVAL_STATUS_UNSPECIFIED = 0;
  APPROVED = 1;
  REJECTED = 2;
  NEEDS_CHANGES = 3;
}

// ApprovalDecisionV2 is an enum-bearing HITL resume schema. Successor to
// ApprovalDecision (flat-scalar). Used as a hitl_config.resume_input_schema
// in coverage specs that exercise the enum-rendering surface of the SPA.
message ApprovalDecisionV2 {
  ApprovalStatus status = 1;
  string reviewer_note = 2;
}

// Reviewer is a small nested submessage used as a field inside
// NestedReviewerDecision. Coverage FR-009.
message Reviewer {
  string name = 1;
  string role = 2;
}

// NestedReviewerDecision is a nested-submessage HITL resume schema —
// exercises ProtoForm.tsx's <details><summary> collapsible rendering for
// nested fields and proto3 length-prefixed submessage wire encoding on
// HITL resume. Coverage FR-009.
message NestedReviewerDecision {
  Reviewer reviewer = 1;
  bool approved = 2;
  string reviewer_note = 3;
}

// StreamFrame is one emitted frame from a streaming type:pipeline node.
// is_final marks the last frame in the stream at the business/payload
// level — distinct from the transport-level NodeResponse.IsFinal sentinel
// the platform appends automatically after the node function returns.
message StreamFrame {
  int32 index = 1;
  string text = 2;
  bool is_final = 3;
}

// ReviewDecision is the input of the Decide node — and, deliberately, a HITL
// resume-form contract that carries ONE FIELD OF EVERY KIND the console's
// resume form renders: a string, an int32, an optional string, a bool
// checkbox, a repeated-string add/remove editor, a nested-message
// <details><summary> collapsible, and an enum Radix Select.
//
// WHY IT IS A NODE INPUT AND NOT A FREE-STANDING MESSAGE (AxiomIDE/poc#1354,
// 2026-08-03): a HITL resume value BECOMES the paused node's input payload —
// sidecar.SidecarRequest carries no other channel for it — so a node's
// `hitl.resume_input_schema` must BE that node's own input message. The
// package's earlier resume-form schemas (ApprovalDecision, ApprovalDecisionV2,
// NestedReviewerDecision, ReviewerEdit) are the input of NO node, so a flow
// pausing on Identity/Echo and declaring one of them could never actually
// resume onto it. That only ever looked fine because a platform defect
// discarded the resume value entirely; once the value really reaches the node,
// those schemas have no live home and the e2e coverage for bool / repeated /
// nested / enum resume controls has nowhere to run. Decide + ReviewDecision is
// that home.
//
// FIELD NUMBERS 1-3 MIRROR `Message` ON PURPOSE (text, value, note, same types
// and same tags), so `Message` wire bytes decode cleanly into ReviewDecision.
// That lets an ordinary Identity/Echo placement feed a Decide placement with
// no edge adapter, which is what keeps the hitl-gates fixtures a plain linear
// chain.
message ReviewDecision {
  string text = 1;
  int32 value = 2;
  string note = 3;
  bool approved = 4;
  repeated string items = 5;
  Reviewer reviewer = 6;
  ApprovalStatus status = 7;
}
